<!doctype html>
<html>
<head>
<title>Fake News Detector AI</title>
<style>
body{font-family:Arial;max-width:800px;margin:auto;padding:40px;background:#f4f4f4}
.card{background:white;padding:24px;border-radius:16px}
textarea{width:100%;height:180px;padding:10px}
button{padding:10px 18px;border:none;border-radius:8px;background:#222;color:#fff}
.result{margin-top:20px;padding:12px;background:#eef;border-radius:10px}
</style>
</head>
<body>
<div class="card">
<h1>Fake News Detector AI</h1>
<form method="post">
<textarea name="news" placeholder="Paste news text here...">{{text}}</textarea><br><br>
<button type="submit">Analyze</button>
</form>
{% if prediction %}
<div class="result">
<h3>{{prediction}}</h3>
<p>Confidence: {{score}}%</p>
</div>
{% endif %}
</div>
</body>
</html>
